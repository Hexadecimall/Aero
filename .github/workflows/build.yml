name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm-dev libclang-dev libclang-cpp-dev liblld-dev python3
      - name: Install macOS test tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm);$(brew --prefix lld)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage installation
        run: cmake --install build --config Release --prefix stage
      - name: Verify installed CLI
        shell: bash
        run: ./stage/bin/aero --version
      - name: Test installed exporter without tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/empty-path
          PATH="$PWD/build/empty-path" SDKROOT=/nonexistent DEVELOPER_DIR=/nonexistent ./stage/bin/aero --program ./build/fixtures/linux-program -o ./build/installed-native
          PATH="$PWD/build/empty-path" ./build/installed-native "Installed export works"
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B build/packages
